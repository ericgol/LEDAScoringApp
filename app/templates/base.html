<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LEDA Drone Scoring{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <h1><a href="/"><span class="accent">LEDA</span> Drone Scoring</a></h1>
                <span class="nav-subtitle">NIST Standard Test Methods for sUAS Proficiency</span>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>LEDA Drone Scoring System &mdash; Based on NIST Standard Test Methods for Evaluating Aerial Drones</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
